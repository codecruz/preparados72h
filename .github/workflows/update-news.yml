name: Actualizar noticias

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas: 00, 06, 12 y 18 UTC (01, 07, 13 y 19 en Madrid en invierno)
  workflow_dispatch:       # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Descargar feeds y regenerar portal/assets/news.js
        run: node scripts/update-news.mjs

      - name: Commit si hay cambios
        run: |
          if git diff --quiet -- portal/assets/news.js; then
            echo "Sin cambios en las noticias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/assets/news.js
          git commit -m "Noticias: actualización automática $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
